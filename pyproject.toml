[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwerewolf"
version = "0.1.0"
description = "AI Werewolf (狼人杀) multi-agent game engine"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
spectator = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aiwerewolf*", "schema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
